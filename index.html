<!doctype html>
<!--
  Page de lancement de Scout Pro.

  Sur Streamlit Cloud, la page aj-scout-pro.streamlit.app appartient à
  Streamlit : son icône d'écran d'accueil et son manifeste sont ceux de
  Streamlit, et l'appli tourne dans une iframe dont les <link> ne sont jamais
  lus par le téléphone. Cette page porte NOS icônes et NOTRE manifeste, et
  affiche l'appli en plein écran (?embed=true retire le cadre Streamlit).
  C'est elle qu'on ajoute à l'écran d'accueil.

  La session de connexion vit côté serveur (session_state), rien dans le
  navigateur : l'iframe ne change rien à l'authentification.
  Icônes : scripts/genere_icones_launcher.py
-->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SCOUT PRO</title>
  <meta name="description" content="Plateforme de scouting avancée">
  <meta name="theme-color" content="#16181D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Scout Pro">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://aj-scout-pro.streamlit.app">
  <style>
    html, body { margin: 0; height: 100%; background: #16181D; overflow: hidden; }
    iframe {
      position: fixed; inset: 0; width: 100%; height: 100%; border: 0;
      /* Encoche et barre d'accueil de l'iPhone en mode plein écran */
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
      box-sizing: border-box; background: #16181D;
    }
    #accueil {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: #16181D; color: #F0F2F5;
      font: 500 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: opacity .35s ease; z-index: 1;
    }
    #accueil.parti { opacity: 0; pointer-events: none; }
    #accueil img { width: 112px; height: 112px; border-radius: 50%; }
    #accueil h1 { margin: 0; font-size: 22px; font-weight: 900; letter-spacing: .5px; }
    #accueil p { margin: 0; color: #888; font-size: 13px; }
    #accueil a { color: #F05014; font-size: 13px; text-decoration: none; opacity: 0; transition: opacity .3s; }
    #accueil a.visible { opacity: 1; }
    @media (prefers-reduced-motion: reduce) { #accueil, #accueil a { transition: none; } }
  </style>
</head>
<body>
  <div id="accueil" role="status" aria-live="polite">
    <img src="icon-192.png" alt="">
    <h1>SCOUT PRO</h1>
    <p>Chargement…</p>
    <a id="secours" href="https://aj-scout-pro.streamlit.app/">Ouvrir directement</a>
  </div>
  <iframe id="appli" title="Scout Pro"
          src="https://aj-scout-pro.streamlit.app/~/+/?embed=true"
          allow="clipboard-read; clipboard-write; fullscreen"></iframe>
  <script>
    var accueil = document.getElementById("accueil");
    // Le cadre Streamlit se charge avant l'appli : on laisse l'écran d'accueil
    // un instant de plus pour ne pas montrer une page vide.
    document.getElementById("appli").addEventListener("load", function () {
      setTimeout(function () { accueil.classList.add("parti"); }, 1200);
    });
    // Appli en veille (réveil ~30 s) ou réseau lent : on propose l'accès direct.
    setTimeout(function () { document.getElementById("secours").classList.add("visible"); }, 8000);
  </script>
</body>
</html>
